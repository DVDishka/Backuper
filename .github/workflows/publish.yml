name: Publish to Modrinth and Hangar

on:
  release:
    types: [published]

jobs:
  publish-modrinth:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      modrinth-url: ${{ steps.publish-modrinth.outputs.modrinth-url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Downloading JAR for tag ${{ github.event.release.tag_name }}"
          gh release download ${{ github.event.release.tag_name }} \
            --pattern "Backuper-*.jar" \
            --dir ./target

          FILE=$(ls target/Backuper-*.jar)
          if [ -z "$FILE" ]; then
            echo "Error: JAR file not found!"
            exit 1
          fi
          echo "JAR_FILE=$FILE" >> $GITHUB_ENV
          echo "Downloaded files:"
          ls -lh ./target/

      - name: Publish to Modrinth
        id: publish-modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: Backuper
          modrinth-featured: true
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          files: |
            target/Backuper-*.jar

          name: Backuper ${{ github.event.release.tag_name }}
          version: ${{ github.event.release.tag_name }}
          version-type: release
          
          changelog: ${{ github.event.release.body }}
          loaders: |
            paper
            purpur
            folia
          game-versions: ">=1.20.6"

      - name: Update Modrinth description
        uses: funnyboy-roks/modrinth-auto-desc@v1.7
        with:
          auth-token: ${{ secrets.MODRINTH_TOKEN }}
          slug: backuper

  publish-hangar:
    runs-on: ubuntu-latest
    needs: publish-modrinth
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish to Hangar
        uses: benwoo1110/hangar-upload-action@v1.0.1
        with:
          api_token: ${{ secrets.HANGAR_TOKEN }}
          slug: Backuper
          version: ${{ github.event.release.tag_name }}
          channel: release
          description: ${{ github.event.release.body }}
          files: |
            [
              {
                "platforms": ["PAPER"],
                "url": true,
                "externalUrl": "${{ needs.publish-modrinth.outputs.modrinth-url }}"
              }
            ]
          platform_dependencies: |
            {
              "PAPER": ["1.20.6","1.21.x", "26.1.x", "26.2"]
            }

      - name: Update Hangar description
        env:
          HANGAR_TOKEN: ${{ secrets.HANGAR_TOKEN }}
        run: |
          set -euo pipefail

          AUTH_RESPONSE="$RUNNER_TEMP/hangar-auth-response.json"
          if ! curl \
            --fail-with-body \
            --silent \
            --show-error \
            --get \
            --request POST \
            --data-urlencode "apiKey=$HANGAR_TOKEN" \
            --header "User-Agent: Backuper GitHub Actions (DVDishka/Backuper)" \
            --output "$AUTH_RESPONSE" \
            https://hangar.papermc.io/api/v1/authenticate; then
            if [ -s "$AUTH_RESPONSE" ]; then
              cat "$AUTH_RESPONSE" >&2
            fi
            exit 1
          fi

          HANGAR_JWT=$(jq -er '.token | select(type == "string" and length > 0)' "$AUTH_RESPONSE")
          echo "::add-mask::$HANGAR_JWT"

          DESCRIPTION_PAYLOAD="$RUNNER_TEMP/hangar-description.json"
          jq -Rs '{content: .}' README.md > "$DESCRIPTION_PAYLOAD"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --request PATCH \
            --header "Authorization: HangarAuth $HANGAR_JWT" \
            --header "Content-Type: application/json" \
            --header "User-Agent: Backuper GitHub Actions (DVDishka/Backuper)" \
            --data-binary "@$DESCRIPTION_PAYLOAD" \
            https://hangar.papermc.io/api/v1/pages/editmain/Backuper
